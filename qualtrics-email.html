<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teams</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    background: #f5f5f5;
    min-height: 100vh;
    padding: 0;
    margin: 0;
  }

  .teams-shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-height: 680px;
    background: #fff;
    border: 1px solid #e0e0e0;
  }

  /* ── HEADER ── */
  .teams-header {
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .teams-header-left {
    display: flex; align-items: center; gap: 10px; flex: 1;
  }
  .teams-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: #6264a7;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #fff;
    flex-shrink: 0; position: relative;
  }
  .teams-presence {
    position: absolute; bottom: 0; right: 0;
    width: 10px; height: 10px;
    background: #f8b21d;
    border-radius: 50%;
    border: 2px solid #fff;
  }
  .teams-header-info { flex: 1; }
  .teams-name {
    font-size: 14px; font-weight: 600; color: #242424;
    line-height: 1.2;
  }
  .teams-status {
    font-size: 11px; color: #616161; display: flex;
    align-items: center; gap: 4px; margin-top: 1px;
  }

  .teams-header-actions {
    display: flex; gap: 4px;
  }
  .header-icon-btn {
    width: 32px; height: 32px;
    border: none; background: transparent;
    border-radius: 4px; cursor: default;
    display: flex; align-items: center; justify-content: center;
    color: #616161;
  }
  .header-icon-btn svg { width: 18px; height: 18px; }

  /* ── MESSAGES ── */
  .teams-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 0;
    background: #fff;
  }

  .msg-group {
    padding: 4px 16px;
    display: flex;
    gap: 10px;
    position: relative;
  }
  .msg-group:hover { background: #f5f5f5; }

  .msg-group-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #6264a7;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #fff;
    flex-shrink: 0; margin-top: 2px;
  }
  .msg-group-avatar.you-avatar { background: #0078d4; }

  .msg-group-content { flex: 1; min-width: 0; }

  .msg-group-header {
    display: flex; align-items: baseline;
    gap: 8px; margin-bottom: 2px;
  }
  .msg-group-name {
    font-size: 13px; font-weight: 700; color: #242424;
  }
  .msg-group-name.you-name { color: #242424; }
  .msg-group-time {
    font-size: 11px; color: #9e9e9e;
  }

  .msg-bubble {
    font-size: 14px; line-height: 1.6;
    color: #242424; white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 2px;
  }

  /* Typing indicator */
  .typing-group {
    display: none;
    padding: 4px 16px;
    align-items: center;
    gap: 10px;
  }
  .typing-group.visible { display: flex; }
  .typing-content {
    font-size: 12px; color: #9e9e9e;
    display: flex; align-items: center; gap: 6px;
    font-style: italic;
  }
  .typing-dots { display: flex; gap: 3px; align-items: center; }
  .typing-dot {
    width: 6px; height: 6px;
    background: #9e9e9e; border-radius: 50%;
    animation: teamsBounce 1.4s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes teamsBounce {
    0%,60%,100% { transform: translateY(0); opacity: 0.4; }
    30%          { transform: translateY(-4px); opacity: 1; }
  }

  /* Date separator */
  .date-sep {
    display: flex; align-items: center;
    padding: 8px 16px; gap: 10px;
    margin: 4px 0;
  }
  .date-sep-line { flex: 1; height: 1px; background: #e0e0e0; }
  .date-sep-text { font-size: 11px; color: #9e9e9e; white-space: nowrap; }

  /* ── COMPOSE ── */
  .teams-compose {
    border-top: 1px solid #e0e0e0;
    padding: 8px 12px 12px;
    background: #fff;
    flex-shrink: 0;
  }

  .compose-box {
    border: 1px solid #d1d1d1;
    border-radius: 4px;
    background: #fff;
    transition: border-color 0.15s;
  }
  .compose-box:focus-within { border-color: #6264a7; }

  .compose-toolbar {
    padding: 6px 10px 4px;
    display: flex; gap: 2px; border-bottom: 1px solid #f0f0f0;
  }
  .toolbar-icon {
    width: 28px; height: 28px;
    border: none; background: transparent;
    border-radius: 3px; cursor: default;
    display: flex; align-items: center; justify-content: center;
    color: #616161;
  }
  .toolbar-icon svg { width: 15px; height: 15px; }

  .compose-input {
    width: 100%;
    border: none; outline: none;
    padding: 8px 12px;
    font-size: 14px;
    font-family: 'Segoe UI', Arial, sans-serif;
    resize: none;
    min-height: 60px;
    max-height: 120px;
    color: #242424;
    line-height: 1.5;
    background: transparent;
    overflow-y: auto;
  }
  .compose-input::placeholder { color: #c7c7c7; }

  .compose-footer {
    padding: 6px 10px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #f0f0f0;
  }
  .compose-footer-left {
    font-size: 11px; color: #9e9e9e; font-style: italic;
  }
  .send-btn {
    background: #6264a7;
    color: #fff; border: none;
    width: 32px; height: 32px;
    border-radius: 4px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: #4f5196; }
  .send-btn:disabled { background: #d1d1d1; cursor: default; }
  .send-btn svg { width: 16px; height: 16px; fill: #fff; margin-left: 1px; }

  .status-msg {
    font-size: 11px; color: #9e9e9e;
    padding: 4px 12px 0;
    font-style: italic; min-height: 16px;
  }

  /* Scrollbar */
  .teams-messages::-webkit-scrollbar { width: 6px; }
  .teams-messages::-webkit-scrollbar-track { background: transparent; }
  .teams-messages::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
</style>
</head>
<body>

<div class="teams-shell">

  <!-- Header -->
  <div class="teams-header">
    <div class="teams-header-left">
      <div class="teams-avatar">
        LW
        <div class="teams-presence"></div>
      </div>
      <div class="teams-header-info">
        <div class="teams-name">Laura Wardwell</div>
        <div class="teams-status">
          <svg viewBox="0 0 16 16" fill="#f8b21d" width="12" height="12"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 1.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zM7.25 4v4.31l2.97 2.97.53-.53-2.75-2.75V4h-.75z"/></svg>
          Busy
        </div>
      </div>
    </div>
    <div class="teams-header-actions">
      <button class="header-icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.361a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
        </svg>
      </button>
      <button class="header-icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Messages -->
  <div class="teams-messages" id="messages">

    <div class="date-sep">
      <div class="date-sep-line"></div>
      <div class="date-sep-text" id="date-label"></div>
      <div class="date-sep-line"></div>
    </div>

    <!-- Initial message -->
    <div class="msg-group">
      <div class="msg-group-avatar">LW</div>
      <div class="msg-group-content">
        <div class="msg-group-header">
          <span class="msg-group-name">Laura Wardwell</span>
          <span class="msg-group-time" id="init-time"></span>
        </div>
        <div class="msg-bubble">Hi — I'm currently working on another client's audit, but send me a message if you need anything and I'll get back to you when I can.</div>
      </div>
    </div>

    <!-- Typing indicator -->
    <div class="typing-group" id="typing-row">
      <div class="msg-group-avatar">LW</div>
      <div class="typing-content">
        <div class="typing-dots">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
        Laura Wardwell is typing…
      </div>
    </div>

  </div>

  <!-- Compose -->
  <div class="teams-compose">
    <div class="compose-box">
      <div class="compose-toolbar">
        <button class="toolbar-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </button>
        <button class="toolbar-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </button>
        <button class="toolbar-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
          </svg>
        </button>
      </div>
      <textarea
        id="compose"
        class="compose-input"
        placeholder="Type a message to Laura Wardwell"
      ></textarea>
      <div class="compose-footer">
        <span class="compose-footer-left">Press Send to submit your message</span>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24"><path d="M2 21L23 12 2 3v7l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
    <div class="status-msg" id="status-msg"></div>
  </div>

</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────
const PROXY_URL = "https://audit-trainer.netlify.app/.netlify/functions/manager-reply";

const _p              = new URLSearchParams(window.location.search);
const CONTROL_INDEX   = _p.get("control")   || "0";
const CURRENT_CONTROL = _p.get("name")      || "an internal control";
const PARTICIPANT_ID  = _p.get("pid")       || "N/A";
const CONDITION       = _p.get("condition") || "N/A";
// ─────────────────────────────────────────────────────────────

let conversationHistory = [];
let isWaiting = false;

function getTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function getDate() {
  return new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}

document.getElementById('init-time').textContent = getTime();
document.getElementById('date-label').textContent = getDate();

// ── RESTORE HISTORY ──
function saveHistory() {
  const msgs = document.getElementById('messages');
  sessionStorage.setItem('lauraHistory', JSON.stringify(conversationHistory));
  const clone = msgs.cloneNode(true);
  clone.querySelector('#typing-row')?.remove();
  sessionStorage.setItem('lauraThread', clone.innerHTML);
}

function restoreHistory() {
  const savedHistory = sessionStorage.getItem('lauraHistory');
  const savedThread  = sessionStorage.getItem('lauraThread');
  if (savedHistory && savedThread) {
    conversationHistory = JSON.parse(savedHistory);
    const msgs   = document.getElementById('messages');
    const typing = document.getElementById('typing-row');
    msgs.innerHTML = savedThread;
    msgs.appendChild(typing);
    msgs.scrollTop = msgs.scrollHeight;
  }
}

restoreHistory();

function appendMessage(text, isLaura) {
  const msgs   = document.getElementById('messages');
  const typing = document.getElementById('typing-row');

  const group = document.createElement('div');
  group.className = 'msg-group';

  const avatarClass = isLaura ? '' : 'you-avatar';
  const nameClass   = isLaura ? '' : 'you-name';
  const initials    = isLaura ? 'LW' : 'YN';
  const sender      = isLaura ? 'Laura Wardwell' : 'You';
  const escaped     = text.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');

  group.innerHTML = `
    <div class="msg-group-avatar ${avatarClass}">${initials}</div>
    <div class="msg-group-content">
      <div class="msg-group-header">
        <span class="msg-group-name ${nameClass}">${sender}</span>
        <span class="msg-group-time">${getTime()}</span>
      </div>
      <div class="msg-bubble">${escaped}</div>
    </div>
  `;

  msgs.insertBefore(group, typing);
  msgs.scrollTop = msgs.scrollHeight;
  saveHistory();
}

function setTyping(visible) {
  document.getElementById('typing-row').classList.toggle('visible', visible);
  document.getElementById('messages').scrollTop = 999999;
}

// Auto-resize textarea
const textarea = document.getElementById('compose');
textarea.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

async function sendMessage() {
  if (isWaiting) return;

  const compose  = document.getElementById('compose');
  const sendBtn  = document.getElementById('send-btn');
  const statusEl = document.getElementById('status-msg');
  const text     = compose.value.trim();
  if (!text) return;

  appendMessage(text, false);
  conversationHistory.push({ role: 'user', content: text });

  compose.value = '';
  compose.style.height = 'auto';
  sendBtn.disabled = true;
  isWaiting = true;
  statusEl.textContent = 'Message sent — Laura may take a moment to respond, please wait.';
  setTyping(true);

  const delay = 30000 + Math.floor(Math.random() * 15000);

  try {
    const response = await fetch(PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages:       conversationHistory,
        currentControl: CURRENT_CONTROL,
        controlIndex:   CONTROL_INDEX,
        participantId:  PARTICIPANT_ID,
        condition:      CONDITION
      })
    });

    const data  = await response.json();
    const reply = data.reply;
    conversationHistory = data.updatedMessages || [...conversationHistory, { role: 'assistant', content: reply }];

    await new Promise(resolve => setTimeout(resolve, delay));

    setTyping(false);
    appendMessage(reply, true);
    statusEl.textContent = '';

  } catch (err) {
    await new Promise(resolve => setTimeout(resolve, delay));
    setTyping(false);
    appendMessage('Sorry for the delay — I was in the middle of something. Let me know if you have any other questions.', true);
    statusEl.textContent = '';
    console.error('Error:', err);
  }

  sendBtn.disabled = false;
  isWaiting = false;
}
</script>
</body>
</html>
