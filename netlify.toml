[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Serve competitive game at /competitive
[[redirects]]
  from = "/competitive"
  to   = "/competitive/index.html"
  status = 200

# Serve no-competition game at /no-competition
[[redirects]]
  from = "/no-competition"
  to   = "/no-competition/index.html"
  status = 200
